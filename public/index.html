<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云笺 CloudNote · 在线协作文档</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%235264E8'/%3E%3Cpath d='M14 32a7 7 0 0 1-1.5-13.8A9 9 0 0 1 30 14h3l4.5 4.5V29a3 3 0 0 1-3 3z' fill='white'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7; color: #1d1d1f; overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ============ 侧边栏 ============ */
  .sidebar {
    width: 250px; background: #fff; border-right: 1px solid #e8e8ed;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .logo {
    padding: 18px 18px 2px; font-size: 17px; font-weight: 700; color: #232A3B;
    display: flex; align-items: center; gap: 8px;
  }
  .logo svg { width: 28px; height: 28px; flex-shrink: 0; }
  .logo-sub { padding: 0 18px 10px 54px; font-size: 11px; color: #aeaeb2; letter-spacing: 1px; }
  .new-doc-btn {
    margin: 4px 14px 10px; padding: 9px 12px; border: none; border-radius: 999px;
    background: #5264E8; color: #fff; font-size: 14px; cursor: pointer; font-weight: 500;
    display: flex; align-items: center; gap: 6px; justify-content: center;
  }
  .new-doc-btn:hover { background: #4453d1; }
  .doc-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .doc-list-label { font-size: 12px; color: #86868b; padding: 6px 10px; }
  .doc-item {
    position: relative; padding: 8px 10px 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
  }
  .doc-item:hover { background: #f5f5f7; }
  .doc-item.active { background: #eceefc; }
  .doc-item.active::before {
    content: ""; position: absolute; left: 2px; top: 10px; bottom: 10px; width: 3px;
    background: #5264E8; border-radius: 2px;
  }
  .doc-name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .doc-item.active .doc-name { color: #4453d1; font-weight: 600; }
  .doc-time { font-size: 11.5px; color: #86868b; margin-top: 3px; }
  .doc-del {
    position: absolute; right: 6px; top: 8px; width: 22px; height: 22px; border: none; border-radius: 5px;
    background: transparent; color: #86868b; cursor: pointer; font-size: 11px; display: none; line-height: 1;
  }
  .doc-item:hover .doc-del { display: block; }
  .doc-del:hover { background: #ffe1de; color: #d83931; }
  .sidebar-account { padding: 10px 12px; border-top: 1px solid #f0f1f3; }
  .sa-login {
    width: 100%; padding: 9px; border: 1px solid #e8e8ed; border-radius: 10px;
    background: #fff; color: #5264E8; font-size: 13.5px; cursor: pointer;
  }
  .sa-login:hover { background: #f6f7fe; border-color: #c3c9f7; }
  .sa-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .sa-user:hover { background: #f5f5f7; }
  .sa-info { min-width: 0; flex: 1; }
  .sa-name { font-size: 13.5px; font-weight: 600; color: #1d1d1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sa-sub { font-size: 11px; color: #aeaeb2; margin-top: 1px; }
  .sa-gear { color: #aeaeb2; font-size: 14px; flex-shrink: 0; }
  /* 单文档模式（侧栏隐藏）时顶栏才显示账号区 */
  #accountArea { display: none; }
  body.single #accountArea { display: block; }

  /* 侧栏标签页 */
  .side-tabs { display: flex; gap: 4px; margin: 0 14px 8px; background: #f5f5f7; border-radius: 8px; padding: 3px; }
  .side-tabs button {
    flex: 1; border: none; background: transparent; font-size: 12.5px; color: #6e6e73;
    padding: 6px 0; border-radius: 6px; cursor: pointer;
  }
  .side-tabs button.cur { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(29,29,31,.08); }
  .list-hint { font-size: 12px; color: #aeaeb2; text-align: center; padding: 30px 12px; line-height: 2; }

  /* 账号区 */
  .acct-btn {
    padding: 7px 15px; border: 1px solid #e8e8ed; border-radius: 999px; background: #fff;
    color: #5264E8; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .acct-btn:hover { background: #f6f7fe; border-color: #c3c9f7; }
  .acct-chip {
    display: flex; align-items: center; gap: 7px; padding: 4px 12px 4px 4px;
    border: 1px solid #e8e8ed; border-radius: 999px; background: #fff; cursor: pointer; white-space: nowrap;
  }
  .acct-chip:hover { background: #f5f5f7; }
  .acct-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: #5264E8; color: #fff; font-size: 12px;
    font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .acct-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .acct-name { font-size: 13px; font-weight: 600; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }

  /* 登录弹窗 */
  .login-tabs { display: flex; gap: 4px; background: #f5f5f7; border-radius: 8px; padding: 3px; margin-bottom: 16px; }
  .login-tabs button {
    flex: 1; border: none; background: transparent; font-size: 13.5px; color: #6e6e73;
    padding: 8px 0; border-radius: 6px; cursor: pointer;
  }
  .login-tabs button.cur { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(29,29,31,.08); }
  .lp-input {
    width: 100%; border: 1px solid #e8e8ed; border-radius: 8px; padding: 11px 12px;
    font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .lp-input:focus { border-color: #5264E8; }
  .lp-mode-row { display: flex; gap: 4px; background: #f5f5f7; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
  .lp-mode {
    flex: 1; border: none; background: transparent; font-size: 13px; color: #6e6e73;
    padding: 7px 0; border-radius: 6px; cursor: pointer;
  }
  .lp-mode.cur { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(29,29,31,.08); }
  .lp-main { width: 100%; padding: 11px; border: none; border-radius: 999px; background: #5264E8; color: #fff; font-size: 14.5px; cursor: pointer; }
  .lp-main:hover { background: #4453d1; }
  .lp-provider {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px;
    border: 1px solid #e8e8ed; border-radius: 10px; background: #fff; font-size: 14px;
    cursor: pointer; margin-bottom: 10px; text-align: left;
  }
  .lp-provider:hover { border-color: #c3c9f7; background: #f6f7fe; }
  .lp-provider.disabled { opacity: .45; }
  .lp-provider .lp-status { margin-left: auto; font-size: 11.5px; color: #aeaeb2; }
  .lp-note { font-size: 11.5px; color: #aeaeb2; line-height: 1.8; margin-top: 4px; }

  /* 账号管理弹窗 */
  .acc-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid #f0f1f3; border-radius: 9px; margin-bottom: 8px; font-size: 13.5px;
  }
  .acc-bind-btn {
    margin-left: auto; border: 1px solid #c3c9f7; background: #fff; color: #5264E8;
    font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .acc-bound { margin-left: auto; font-size: 12px; color: #34c724; }
  #accLogout {
    width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 999px;
    background: #f5f5f7; color: #d83931; font-size: 13.5px; cursor: pointer;
  }

  body.single .sidebar { display: none; }

  /* ============ 主区域 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px; background: #fff; border-bottom: 1px solid #e8e8ed;
    display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0;
  }
  .top-title {
    flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #1d1d1f; max-width: 42%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;
  }
  .status { font-size: 12px; color: #86868b; white-space: nowrap; }
  .status.saved { color: #34c724; }
  .status.saving { color: #ff8800; }
  .status.error { color: #d83931; }
  .wordcount { font-size: 12px; color: #86868b; white-space: nowrap; }

  /* 在线协作者头像 */
  #avatars { display: flex; align-items: center; padding: 0 2px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid #fff; margin-left: -7px; cursor: pointer; user-select: none;
    box-shadow: 0 0 0 1px rgba(31,35,41,.12);
  }
  .avatar.me { border-color: #5264E8; }
  .avatar.more { background: #86868b; }

  .share-btn {
    padding: 7px 15px; border: 1px solid #c3c9f7; border-radius: 999px; background: #fff; color: #5264E8;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .share-btn:hover { background: #f6f7fe; }
  .export-btn {
    padding: 7px 15px; border: none; border-radius: 999px; background: #5264E8; color: #fff;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .export-btn:hover { background: #4453d1; }

  .page-wrap { flex: 1; overflow-y: auto; position: relative; }
  .page-wrap.dragging .page { outline: 2px dashed #5264E8; outline-offset: -2px; }

  /* ============ 工具栏（毛玻璃 + 线条图标） ============ */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 255, 255, .88); backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid #e8e8ed;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 20px;
  }
  .tb-btn {
    min-width: 38px; height: 38px; padding: 0 9px; border: none; border-radius: 9px;
    background: transparent; color: #3a3a3c; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; user-select: none;
    white-space: nowrap; transition: background .12s, color .12s;
  }
  .tb-btn svg { width: 18px; height: 18px; display: block; }
  .tb-btn:hover { background: #f5f5f7; color: #1d1d1f; }
  .tb-btn.active { background: #dbeafe; color: #5264E8; }
  .tb-btn b { font-weight: 700; font-size: 15px; }
  .tb-btn .i { font-style: italic; font-family: Georgia, serif; font-size: 15px; }
  .tb-btn .u { text-decoration: underline; font-size: 15px; }
  .tb-btn .s { text-decoration: line-through; font-size: 15px; }
  .tb-btn.tb-text { font-weight: 700; font-size: 13px; letter-spacing: .2px; }
  /* 重点标注：评论按钮 */
  .tb-btn.tb-accent {
    background: #5264E8; color: #fff; border-radius: 999px;
    padding: 0 14px; box-shadow: 0 2px 8px rgba(82, 100, 232, .35);
  }
  .tb-btn.tb-accent:hover { background: #4453d1; color: #fff; box-shadow: 0 3px 10px rgba(82, 100, 232, .45); }
  .tb-btn.tb-accent .tb-label { font-size: 13px; font-weight: 600; }
  .ico-tcolor { font-weight: 700; font-size: 15px; border-bottom: 3px solid #ff453a; line-height: 1.05; padding: 0 1px; }
  .ico-hilite { font-weight: 700; font-size: 15px; background: #ffe08a; border-radius: 4px; padding: 0 3px; line-height: 1.1; }
  .tb-sep { width: 1px; height: 20px; background: #e8e8ed; margin: 0 8px; }

  /* ============ 编辑区 ============ */
  /* 只读模式 */
  body.read-only .toolbar { display: none; }
  #readonlyBar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fff7ed; border: 1px solid #ffe4c6; color: #b25e09;
    font-size: 13px; border-radius: 10px; padding: 9px 14px; margin-bottom: 14px;
  }
  #readonlyBar .ro-login {
    border: none; background: #5264E8; color: #fff; font-size: 12.5px;
    padding: 5px 14px; border-radius: 999px; cursor: pointer;
  }
  #readonlyBar .ro-close {
    border: none; background: transparent; color: #d9a05b; font-size: 13px;
    cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1;
  }
  #readonlyBar .ro-close:hover { background: rgba(0,0,0,.05); color: #b25e09; }
  .page {
    width: min(860px, 94%); margin: 28px auto 80px; background: #fff; border-radius: 10px;
    padding: 48px 64px 80px; box-shadow: 0 1px 3px rgba(31,35,41,.08);
    min-height: 70vh;
  }
  #editor { outline: none; min-height: 55vh; font-size: 15.5px; line-height: 1.8; overflow-wrap: break-word; }
  /* 兜底：任何进入编辑器的图片/视频（含粘贴的裸 img）都不许超出正文宽度；
     !important 压过粘贴内容自带的内联 width/height 样式，防止图片被压扁 */
  #editor img, #editor video { max-width: 100% !important; height: auto !important; box-sizing: border-box; }
  #editor:empty::before { content: "开始输入吧…  空行键入 \"/\" 可快速插入标题、图片、视频等"; color: #aeaeb2; }

  /* 文档标题（正文正上方） */
  .doc-title {
    font-size: 30px; font-weight: 700; line-height: 1.35; outline: none;
    padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid #f0f1f3;
    word-break: break-word; caret-color: #5264E8;
  }
  .doc-title:empty::before { content: "无标题文档"; color: #c7c7cc; }

  /* 左侧目录 */
  #tocPanel {
    width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid #e8e8ed;
    overflow-y: auto; padding: 18px 8px 18px 12px;
  }
  .toc-head { font-size: 12px; color: #86868b; padding: 0 8px 10px; font-weight: 600; letter-spacing: 1px; }
  .toc-item {
    font-size: 13px; color: #6e6e73; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent;
  }
  .toc-item:hover { background: #f5f5f7; color: #1d1d1f; }
  .toc-item.active { color: #5264E8; background: #eceefc; border-left-color: #5264E8; font-weight: 600; }
  .toc-lv1 { font-weight: 600; }
  .toc-lv2 { padding-left: 22px; }
  .toc-lv3 { padding-left: 36px; }
  .toc-empty { font-size: 12px; color: #aeaeb2; text-align: center; padding: 36px 8px; line-height: 2; }
  @media (max-width: 1200px) { #tocPanel { display: none; } }

  /* 段后距：所有段落（含外部粘贴的 div）默认留白，不再拥挤 */
  #editor p, #editor div { margin: 0 0 10px; }
  #editor h1 { font-size: 26px; font-weight: 700; margin: 24px 0 10px; line-height: 1.4; }
  #editor h2 { font-size: 22px; font-weight: 700; margin: 20px 0 8px; line-height: 1.4; }
  #editor h3 { font-size: 18px; font-weight: 600; margin: 16px 0 6px; line-height: 1.4; }
  #editor ul, #editor ol { padding-left: 1.5em; margin: 6px 0; }
  #editor li { margin: 3px 0; }
  #editor blockquote {
    border-left: 3px solid #5264E8; background: #f6f7fe; color: #6e6e73;
    padding: 6px 14px; border-radius: 0 6px 6px 0; margin: 10px 0;
  }
  #editor pre {
    background: #f5f6f8; border: 1px solid #ebedf0; border-radius: 6px;
    padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 13.5px; white-space: pre-wrap; word-break: break-all; margin: 10px 0; color: #1d1d1f;
  }
  #editor a { color: #5264E8; }
  #editor hr { border: none; border-top: 1px solid #e8e8ed; margin: 20px 0; }
  #editor figure.media { margin: 20px auto; position: relative; max-width: 100%; }
  #editor figure.media img, #editor figure.media video {
    display: block; margin: 0 auto; max-width: 100%; height: auto;
    border-radius: 12px; cursor: pointer;
    box-shadow: 0 1px 6px rgba(31, 35, 41, .08);
  }
  #editor figure.media video { background: #000; }
  #editor figure.media.selected img { outline: 2px solid #5264E8; outline-offset: 2px; }
  #editor figure.media.selected video { outline: 2px solid #5264E8; outline-offset: 2px; }
  #editor figcaption {
    text-align: center; font-size: 12.5px; color: #86868b; padding-top: 8px; cursor: text;
    letter-spacing: .3px;
  }
  #editor figcaption:empty { display: none; }

  /* 媒体评论标记 */
  #editor figure.media.commented img, #editor figure.media.commented video {
    outline: 2px solid #f0b400; outline-offset: 3px; border-radius: 8px;
  }
  #editor figure.media.commented::after {
    content: "💬"; position: absolute; top: -10px; right: 10px; background: #f0b400; color: #fff;
    font-size: 12px; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(31,35,41,.25); pointer-events: none;
  }

  /* 划线评论高亮 */
  #editor .hl { background: #fff1a8; border-bottom: 2px solid #f0b400; cursor: pointer; border-radius: 2px; }
  #editor .hl.flash { animation: hlflash 1.2s ease; }
  @keyframes hlflash { 0%, 100% { background: #fff1a8; } 40% { background: #ffd640; } }

  /* ============ 媒体操作条 ============ */
  #mediaBar {
    position: fixed; z-index: 60; background: #fff; border: 1px solid #e8e8ed; border-radius: 8px;
    box-shadow: 0 4px 14px rgba(31,35,41,.14); padding: 4px; display: none; gap: 2px;
  }
  #mediaBar.show { display: flex; }
  #mediaBar button {
    border: none; background: transparent; border-radius: 5px; padding: 5px 8px; font-size: 12px;
    cursor: pointer; color: #3a3a3c; white-space: nowrap;
  }
  #mediaBar button:hover { background: #f5f5f7; }
  #mediaBar button.danger:hover { background: #ffe1de; color: #d83931; }

  /* ============ "/" 快捷菜单 ============ */
  #slashMenu {
    position: absolute; z-index: 50; width: 260px; background: #fff; border: 1px solid #e8e8ed;
    border-radius: 10px; box-shadow: 0 6px 20px rgba(31,35,41,.14); padding: 6px; display: none;
    max-height: 320px; overflow-y: auto;
  }
  #slashMenu.show { display: block; }
  .slash-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px;
    cursor: pointer; font-size: 13.5px;
  }
  .slash-item.cur, .slash-item:hover { background: #eceefc; }
  .slash-icon {
    width: 26px; height: 26px; border-radius: 6px; background: #f5f5f7; color: #5264E8;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }

  /* ============ 弹窗 / 颜色 / 提示 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(31,35,41,.32); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; padding: 22px; width: 380px;
    box-shadow: 0 10px 40px rgba(31,35,41,.2);
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .modal-btns { display: flex; flex-direction: column; gap: 8px; }
  .modal-btns button {
    padding: 10px 12px; border: 1px solid #e8e8ed; border-radius: 8px; background: #fff;
    font-size: 13.5px; cursor: pointer; text-align: left;
  }
  .modal-btns button:hover { background: #f6f7fe; border-color: #c3c9f7; }
  .modal-btns button.cancel { text-align: center; color: #86868b; }

  .share-opts label {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid #e8e8ed;
    border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13.5px;
  }
  .share-opts label:hover { border-color: #c3c9f7; background: #f6f7fe; }
  .share-opts input { accent-color: #5264E8; }
  .share-link-row { display: flex; gap: 6px; margin: 14px 0 6px; }
  .share-link-row input {
    flex: 1; min-width: 0; border: 1px solid #e8e8ed; border-radius: 7px; padding: 8px 10px;
    font-size: 12px; color: #6e6e73; background: #f7f8fa;
  }
  .share-link-row button {
    padding: 0 14px; border: none; border-radius: 7px; background: #5264E8; color: #fff;
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .share-link-row button:hover { background: #4453d1; }
  .share-tip { font-size: 11.5px; color: #aeaeb2; line-height: 1.7; margin-bottom: 12px; }
  .modal .cancel-close {

  #colorPop {

  .swatch:hover { transform: scale(1.15); }
  .pop-label { font-size: 11.5px; color: #86868b; margin-bottom: 6px; }

  /* ============ 评论面板（常驻右侧） ============ */
  .content-row { flex: 1; display: flex; min-height: 0; }

    width: 300px; flex-shrink: 0; background: #fff; border-left: 1px solid #e8e8ed;

    position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 39;
    background: #fff; border: 1px solid #e8e8ed; border-right: none; border-radius: 8px 0 0 8px;
    padding: 14px 6px; cursor: pointer; font-size: 12px; color: #6e6e73; writing-mode: vertical-lr;

  }

  #panelHandle:hover { color: #5264E8; }
  .cp-head {
    padding: 14px 16px; font-size: 14.5px; font-weight: 600; border-bottom: 1px solid #f5f5f7;
    display: flex; justify-content: space-between; align-items: center;

  .cp-new { padding: 12px 14px; border-bottom: 1px solid #f5f5f7; background: #f6f7fe; display: none; }
  .cp-quote {

  }
  #cpText {
    width: 100%; height: 64px; border: 1px solid #e8e8ed; border-radius: 7px; padding: 8px 10px;
    font-size: 13px; resize: vertical; font-family: inherit; outline: none;

  .cp-btns { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .cp-btns button { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12.5px; cursor: pointer; }
  #cpSend { background: #5264E8; color: #fff; }
  #cpSend:hover { background: #4453d1; }
  #cpCancel { background: #f5f5f7; color: #6e6e73; }
  .cp-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .cp-empty { color: #aeaeb2; font-size: 12.5px; text-align: center; padding: 40px 10px; line-height: 2; }
  .cp-item {
    border: 1px solid #f0f1f3; border-radius: 9px; padding: 10px 12px; margin-bottom: 10px;
    background: #fff; cursor: pointer; transition: border-color .12s, box-shadow .12s;
  }
  .cp-item:hover { border-color: #c3c9f7; box-shadow: 0 2px 8px rgba(82, 100, 232, .08); }

  /* 评论面板标签 + 已解决归档 */
  .cp-tabs {
    display: flex; gap: 4px; margin: 10px 14px 4px; background: #f5f5f7; border-radius: 8px; padding: 3px;
    flex-shrink: 0;
  }
  .cp-tabs button {
    flex: 1; border: none; background: transparent; font-size: 12.5px; color: #6e6e73;
    padding: 6px 0; border-radius: 6px; cursor: pointer;
  }
  .cp-tabs button.cur { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(29,29,31,.08); }
  .cp-item.done { cursor: default; opacity: .95; }
  .cp-item.done:hover { border-color: #f0f1f3; box-shadow: none; }
  .cp-diff { font-size: 12px; margin: 4px 0 2px; }
  .cp-before, .cp-after { display: flex; gap: 6px; align-items: baseline; margin: 3px 0; }
  .cp-tag { flex-shrink: 0; font-size: 10.5px; color: #fff; background: #aeaeb2; border-radius: 4px; padding: 1px 5px; }
  .cp-tag.after { background: #34c724; }
  .cp-diff-text { color: #6e6e73; word-break: break-word; line-height: 1.5; }
  .cp-before .cp-diff-text { text-decoration: line-through; text-decoration-color: rgba(216,57,49,.55); }
  .cp-resolver { font-size: 11.5px; color: #34c724; margin-top: 6px; }
  .cp-head2 { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .cp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cp-author { font-size: 13px; font-weight: 600; }
  .cp-time { font-size: 11px; color: #aeaeb2; margin-left: auto; }
  .cp-item .cp-quote { border-color: #e8e8ed; margin: 4px 0; }
  .cp-body { font-size: 13.5px; line-height: 1.6; margin-top: 4px; word-break: break-word; white-space: pre-wrap; }
  .cp-acts { display: flex; gap: 6px; margin-top: 8px; }
  .cp-acts button {
    border: none; background: #f5f5f7; color: #6e6e73; font-size: 11.5px; padding: 4px 10px;
    border-radius: 5px; cursor: pointer;
  }
  .cp-acts button:hover { background: #e8eaed; }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #2b2f36; color: #fff; font-size: 13px; border-radius: 8px; padding: 10px 18px;
    opacity: 0; transition: all .25s; z-index: 200; pointer-events: none; max-width: 80vw; line-height: 1.6;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #bootMask {
    position: fixed; inset: 0; background: #f5f5f7; z-index: 300;

  @media (max-width: 900px) {

    .page { padding: 30px 24px 60px; }

    body.panel-open-mobile #commentPanel { display: flex; }
    #panelHandle { display: block; }
  }
</style>

<script>
(function () {

  var editor = $('#editor');

  var wordEl = $('#wordCount');
  var wrap = $('#pageWrap');
  var slashMenu = $('#slashMenu');
  var mediaBar = $('#mediaBar');
  var colorPop = $('#colorPop');
  var toastEl = $('#toast');
  var bootMask = $('#bootMask');

  var store = { docs: [], activeId: null };
  var saveTimer = null;
  var savedRange = null;
  var slashStart = null, slashIsOpen = false, slashCur = 0, slashFiltered = [];
  var mediaTarget = null;
  var dragCount = 0;
  var dirty = false;          // 本地是否有未保存到服务器的修改
  var comments = [];
  var draftCid = null, draftQuote = '';

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ================= 用户身份（协作者） ================= */
  var PALETTE = ['#5264E8', '#00b2ff', '#34c724', '#ff8800', '#9f13b9', '#e8388f', '#2aa876', '#d83931'];
  var user = (function () {
    try {
      var u = JSON.parse(localStorage.getItem('liteDoc.user'));
      if (u && u.id && u.name) return u;
    } catch (e) {}
    var u = {
      id: uid(),
      name: '用户' + Math.floor(100 + Math.random() * 900),
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
    };
    try { localStorage.setItem('liteDoc.user', JSON.stringify(u)); } catch (e) {}
    return u;
  })();
  function renameUser() {
    var n = prompt('你的昵称（其他人会在协作者头像里看到）：', user.name);
    if (n && n.trim()) {
      user.name = n.trim().slice(0, 20);
      try { localStorage.setItem('liteDoc.user', JSON.stringify(user)); } catch (e) {}
      presenceTick();
    }
  }

  /* ================= 服务器 API ================= */
  function api(method, url, body, isForm) {
    var opt = { method: method, headers: {} };
    if (body !== undefined && !isForm) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    } else if (body !== undefined) {
      opt.body = body; // FormData
    }
    return fetch(url, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  /* ================= 文档存储 ================= */
  function activeDoc() {
    for (var i = 0; i < store.docs.length; i++) if (store.docs[i].id === store.activeId) return store.docs[i];
    return null;
  }
  function saveCurrent() {
    var d = activeDoc(); if (!d) return;
    d.html = editor.innerHTML;
    d.title = titleInput.textContent.trim() || '无标题文档';
    d.updated = Date.now();
  }
  function persist(docArg, force) {
    var d = docArg || activeDoc();
    if (!d) { setStatus('saved'); return Promise.resolve(); }
    setStatus('saving');
    var payload = { title: d.title, html: d.html };
    if (!force) payload.baseRev = d.rev || 0;
    return api('PUT', '/api/docs/' + d.id, payload).then(function (res) {
      d.rev = res.rev; d.updated = res.updated || d.updated;
      if (!docArg) dirty = false;
      setStatus('saved'); renderList();
    }).catch(function (err) {
      if (err && err.status === 409 && !force) {
        // 有他人同时保存：强制覆盖（后保存者胜），保住本地刚写的内容
        return persist(d, true).then(function () {
          toast('👥 检测到他人同时编辑，本次保存以你的版本为准（对方会自动刷新）');
        });
      }
      if (err && err.status === 401) {
        setStatus('error');
        toast('🔒 登录后才能编辑此文档');
        openLoginModal();
        return;
      }
      if (err && err.status === 403) {
        setStatus('error');
        toast('🔒 你没有这篇文档的编辑权限');
        return;
      }
      setStatus('error');
      toast('⚠️ 保存到服务器失败，请检查网络');
    });
  }
  function scheduleSave() {
    saveCurrent();
    dirty = true;
    setStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { persist(); }, 700);
  }
  function setStatus(cls) {
    statusEl.className = 'status ' + cls;
    var t = new Date();
    var hh = ('0' + t.getHours()).slice(-2), mm = ('0' + t.getMinutes()).slice(-2);
    statusEl.textContent = cls === 'saved' ? ('已保存 ' + hh + ':' + mm)
      : cls === 'saving' ? '保存中…' : '保存失败';
  }
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
    if (d.toDateString() === now.toDateString()) return '今天 ' + hh + ':' + mm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
  }

  /* ================= 文档列表（全部 / 我写的 / 浏览过） ================= */
  function renderList() {
    if (singleMode) return;
    if (sideTab === 'viewed') { renderViewedList(); return; }
    listEl.innerHTML = '';
    var docs = store.docs.slice().sort(function (a, b) { return b.updated - a.updated; });
    if (sideTab === 'mine') {
      if (!me) {
        listEl.innerHTML = '<div class="list-hint">登录后<br>这里会显示你写的文档</div>';
        return;
      }
      docs = docs.filter(function (d) { return d.ownerId === me.id; });
    }
    if (!docs.length) {
      listEl.innerHTML = '<div class="list-hint">' +
        (sideTab === 'mine' ? '还没有你写的文档<br>点上方「新建文档」开始' : '暂无文档') + '</div>';
      return;
    }
    docs.forEach(function (d) {
      var li = document.createElement('li');
      li.className = 'doc-item' + (d.id === store.activeId ? ' active' : '');
      li.dataset.id = d.id;
      li.innerHTML = '<div class="doc-name"></div><div class="doc-time">' + fmtTime(d.updated) + '</div><button class="doc-del" title="删除文档">✕</button>';
      $('.doc-name', li).textContent = d.title;
      li.addEventListener('click', function (e) {
        if (e.target.closest('.doc-del')) return;
        if (d.id !== store.activeId) openDoc(d.id);
      });
      $('.doc-del', li).addEventListener('click', function (e) { e.stopPropagation(); deleteDoc(d.id); });
      listEl.appendChild(li);
    });
  }
  function renderViewedList() {
    listEl.innerHTML = '<div class="list-hint">加载中…</div>';
    api('GET', '/api/my/docs?anonKey=' + encodeURIComponent(user.id)).then(function (r) {
      listEl.innerHTML = '';
      var viewed = r.viewed || [];
      if (!viewed.length) {
        listEl.innerHTML = '<div class="list-hint">还没有浏览记录<br>打开过的文档会出现在这里</div>';
        return;
      }
      viewed.forEach(function (v) {
        var li = document.createElement('li');
        li.className = 'doc-item' + (v.id === store.activeId ? ' active' : '');
        li.innerHTML = '<div class="doc-name"></div><div class="doc-time">浏览于 ' + fmtTime(v.viewed_at) + '</div>';
        $('.doc-name', li).textContent = v.title;
        li.addEventListener('click', function () { openDocById(v.id); });
        listEl.appendChild(li);
      });
    }).catch(function () {
      listEl.innerHTML = '<div class="list-hint">加载失败</div>';
    });
  }
  function openDocById(id) {
    var existing = null;
    store.docs.forEach(function (d) { if (d.id === id) existing = d; });
    if (existing) { openDoc(id); return; }
    api('GET', '/api/docs/' + id).then(function (d) {
      d.shareMode = d.share_mode || 'off';
      d.ownerId = d.owner_id || '';
      d.canEdit = d.can_edit !== false;
      d.isOwner = d.is_owner !== false;
      store.docs.push(d);
      openDoc(id);
    }).catch(function (e) {
      if (e && e.status === 403) toast('🔒 此文档未开启分享，仅作者可见');
      else toast('文档不存在或已被删除');
    });
  }
  function recordView() {
    if (!store.activeId) return;
    api('POST', '/api/docs/' + store.activeId + '/view', { anonKey: user.id }).catch(function () {});
  }
  function openDoc(id) {
    var old = activeDoc();
    if (old && dirty && old.id !== id) { old.html = editor.innerHTML; old.title = titleInput.textContent.trim() || '无标题文档'; persist(old); }
    clearTimeout(saveTimer);
    dirty = false;
    store.activeId = id;
    var d = activeDoc();
    editor.innerHTML = d.html;
    titleInput.textContent = d.title;
    sanitizeMedia();
    renderList(); updateWordCount(); setStatus('saved');
    updateTopTitle(); buildToc();
    wrap.scrollTop = 0;
    openPanel(false);
    presenceTick();
    loadComments();
    recordView();
    applyDocPerm();
    if (editor.contentEditable === 'true') editor.focus();
  }
  $('#btnNew').addEventListener('click', function () {
    if (!me) { toast('登录后才能创建文档'); openLoginModal(); return; }
    api('POST', '/api/docs', { title: '无标题文档', html: '' }).then(function (d) {
      var old = activeDoc();
      if (old && dirty) { old.html = editor.innerHTML; old.title = titleInput.textContent.trim() || '无标题文档'; persist(old); }
      d.shareMode = d.share_mode || 'off';
      d.ownerId = d.owner_id || '';
      store.docs.push(d);
      store.activeId = d.id;
      dirty = false;
      editor.innerHTML = ''; titleInput.textContent = '';
      renderList(); updateWordCount(); setStatus('saved');
      openPanel(false); comments = []; renderComments();
      applyDocPerm();
      editor.focus();
    }).catch(function (e) {
      if (e && e.status === 401) { toast('登录后才能创建文档'); openLoginModal(); }
      else toast('新建失败，请检查网络');
    });
  });
  function deleteDoc(id) {
    if (!confirm('确定删除这篇文档吗？此操作不可恢复。')) return;
    api('DELETE', '/api/docs/' + id).then(function () {
      var idx = -1;
      for (var i = 0; i < store.docs.length; i++) if (store.docs[i].id === id) idx = i;
      if (idx < 0) return;
      store.docs.splice(idx, 1);
      if (!store.docs.length) {
        return api('POST', '/api/docs', { title: '无标题文档', html: '' }).then(function (d) {
          d.shareMode = d.share_mode || 'off';
          store.docs.push(d); store.activeId = d.id;
          editor.innerHTML = ''; titleInput.textContent = '';
          renderList(); updateWordCount();
        });
      }
      if (store.activeId === id) {
        store.activeId = store.docs[0].id;
        editor.innerHTML = store.docs[0].html;
        titleInput.textContent = store.docs[0].title;
        updateWordCount(); loadComments(); applyDocPerm();
      }
      renderList();
    }).catch(function (e) {
      if (e && e.status === 403) toast('只有作者才能删除这篇文档');
      else toast('删除失败，请检查网络');
    });
  }

  /* ================= 排版命令 ================= */
  function fmt(cmd, val) {
    editor.focus();
    try { document.execCommand(cmd, false, val || null); } catch (e) {}
    scheduleSave(); updateToolbar();
  }
  function updateToolbar() {
    document.querySelectorAll('#toolbar .tb-btn[data-cmd]').forEach(function (b) {
      var c = b.dataset.cmd, on = false;
      try {
        if (c === 'formatBlock') {
          var v = (document.queryCommandValue('formatBlock') || '').toLowerCase();
          on = v === (b.dataset.val || '').toLowerCase();
        } else if (['bold', 'italic', 'underline', 'strikeThrough', 'insertUnorderedList', 'insertOrderedList'].indexOf(c) >= 0) {
          on = document.queryCommandState(c);
        }
      } catch (e) {}
      b.classList.toggle('active', !!on);
    });
  }
  document.addEventListener('selectionchange', function () {
    var sel = document.getSelection();
    if (editor.contains(sel.anchorNode) || document.activeElement === editor) updateToolbar();
    clearTimeout(autoCommentTimer);
    autoCommentTimer = setTimeout(autoSelectionComment, 350);
  });
  var autoCommentTimer = null;
  /* 选中文字后自动弹出评论框（面板常驻右侧） */
  function autoSelectionComment() {
    if (slashIsOpen) return;
    if (document.activeElement === $('#cpText')) return; // 正在写评论时不打断
    if (mediaTarget) return;
    // 未写内容的草稿划线：换选区时自动清掉，避免留无评论的孤儿黄线
    if (draftCid && !$('#cpText').value.trim()) { unwrapHl(draftCid); draftCid = null; $('#cpNew').style.display = 'none'; }
    var s = document.getSelection();
    if (!s.rangeCount || s.isCollapsed) return;
    if (!editor.contains(s.anchorNode)) return;
    var text = s.toString().trim();
    if (!text) return;
    // 选区已落在划线内
    var anchorEl = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement;
    var existHl = anchorEl && anchorEl.closest ? anchorEl.closest('span.hl') : null;
    if (existHl && existHl.dataset.cid) {
      if (existHl.dataset.cid === draftCid) { openPanel(true); return; } // 自己的草稿划线：继续写
      openPanel(false); locateCid(existHl.dataset.cid); return;
    }
    // 同段落内才允许划线
    var startNode = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement;
    var endNode = s.focusNode.nodeType === 1 ? s.focusNode : s.focusNode.parentElement;
    if (getClosestBlock(startNode) !== getClosestBlock(endNode)) return;
    commentFlowText(text);
  }

  $('#toolbar').addEventListener('mousedown', function (e) {
    if (e.target.closest('.tb-btn')) { e.preventDefault(); saveSel(); }
  });
  $('#toolbar').addEventListener('click', function (e) {
    var btn = e.target.closest('.tb-btn');
    if (!btn) return;
    if (btn.dataset.cmd) { fmt(btn.dataset.cmd, btn.dataset.val); return; }
    var act = btn.dataset.action;
    if (act === 'image') chooseMedia('image');
    else if (act === 'video') chooseMedia('video');
    else if (act === 'link') linkFlow();
    else if (act === 'comment') commentFlow();
  });

  /* ================= 选区保存/恢复 ================= */
  function saveSel() {
    var s = document.getSelection();
    if (s.rangeCount && editor.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
  }
  function restoreSel() {
    if (!savedRange) { editor.focus(); return; }
    editor.focus();
    var s = document.getSelection();
    s.removeAllRanges();
    try { s.addRange(savedRange); } catch (e) {}
  }

  /* ================= 媒体插入 ================= */
  function getClosestBlock(el) {
    var blocks = ['P', 'H1', 'H2', 'H3', 'H4', 'BLOCKQUOTE', 'PRE', 'LI', 'UL', 'OL', 'FIGURE', 'DIV'];
    var n = el;
    while (n && n !== editor) { if (blocks.indexOf(n.tagName) >= 0) return n; n = n.parentElement; }
    return null;
  }
  function insertBlockAfterCurrent(block) {
    restoreSel();
    var s = document.getSelection();
    var anchor = (s.rangeCount && s.anchorNode)
      ? (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement) : null;
    var blk = anchor ? getClosestBlock(anchor) : null;
    var p = document.createElement('p'); p.innerHTML = '<br>';
    if (blk && blk !== editor) {
      blk.parentNode.insertBefore(block, blk.nextSibling);
      blk.parentNode.insertBefore(p, block.nextSibling);
    } else {
      editor.appendChild(block); editor.appendChild(p);
    }
    var r = document.createRange();
    r.setStart(p, 0); r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
    savedRange = r.cloneRange();
    scheduleSave();
  }
  function makeMediaBlock(el, caption) {
    var f = document.createElement('figure');
    f.className = 'media';
    f.appendChild(el);
    if (caption) {
      var c = document.createElement('figcaption');
      c.textContent = caption;
      f.appendChild(c);
    }
    return f;
  }
  function insertImageSrc(src, name) {
    var img = new Image();
    img.src = src; img.alt = name || '图片'; img.draggable = false;
    insertBlockAfterCurrent(makeMediaBlock(img, ''));
  }
  function insertVideoSrc(src) {
    var v = document.createElement('video');
    v.src = src; v.controls = true; v.preload = 'metadata';
    insertBlockAfterCurrent(makeMediaBlock(v, ''));
  }
  var uploading = 0;
  function insertFile(file) {
    if (file.type && file.type.indexOf('image/') === 0) { uploadAndInsert(file, 'image'); }
    else if (file.type && file.type.indexOf('video/') === 0) { uploadAndInsert(file, 'video'); }
    else toast('暂不支持该文件类型：' + (file.name || file.type || '未知'));
  }
  function uploadAndInsert(file, kind) {
    uploading++;
    toast('正在上传「' + file.name + '」…', 30000);
    var fd = new FormData();
    fd.append('file', file);
    api('POST', '/api/upload', fd, true).then(function (res) {
      uploading--;
      if (uploading <= 0) toast('上传完成 ✓', 1600);
      if (kind === 'image') insertImageSrc(res.url, file.name);
      else insertVideoSrc(res.url);
    }).catch(function () {
      uploading--;
      toast('⚠️ 上传失败：' + file.name);
    });
  }
  $('#fileImage').addEventListener('change', function () {
    [].forEach.call(this.files, insertFile);
    this.value = '';
  });
  $('#fileVideo').addEventListener('change', function () {
    [].forEach.call(this.files, insertFile);
    this.value = '';
  });

  /* ================= 插入方式选择弹窗 ================= */
  var mediaModal = $('#mediaModal'), mediaKind = 'image';
  function chooseMedia(kind) {
    saveSel();
    mediaKind = kind;
    $('#mmTitle').textContent = kind === 'image' ? '插入图片（支持 PNG / JPG / GIF 动图 / WebP）' : '插入视频（自动上传到服务器）';
    $('#mmFile').textContent = kind === 'image' ? '📁 上传本地图片' : '📁 上传本地视频';
    $('#mmLink').textContent = '🔗 使用在线链接';
    mediaModal.classList.add('show');
  }
  $('#mmFile').addEventListener('click', function () {
    mediaModal.classList.remove('show');
    (mediaKind === 'image' ? $('#fileImage') : $('#fileVideo')).click();
  });
  $('#mmLink').addEventListener('click', function () {
    mediaModal.classList.remove('show');
    var url = prompt('请输入在线链接地址：', 'https://');
    if (!url || url === 'https://') return;
    if (mediaKind === 'image') insertImageSrc(url, '');
    else insertVideoSrc(url);
  });
  $('#mmCancel').addEventListener('click', function () { mediaModal.classList.remove('show'); });
  mediaModal.addEventListener('click', function (e) { if (e.target === mediaModal) mediaModal.classList.remove('show'); });

  /* ================= 链接 ================= */
  function linkFlow() {
    var s = document.getSelection();
    var hasText = s.toString().length > 0;
    var url = prompt('请输入链接地址：', 'https://');
    if (!url || url === 'https://') return;
    if (hasText) fmt('createLink', url);
    else fmt('insertHTML', '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>');
  }

  /* ================= 颜色 ================= */
  var colors = ['#1d1d1f', '#5264E8', '#00b2ff', '#34c724', '#ff8800', '#ff3b30', '#9f13b9', '#8a8f99',
    '#ffffff', '#dbe5ff', '#c9f0ff', '#cdf4c6', '#ffe4c6', '#ffd6d3', '#f3d9ff', '#fff3b0'];
  var colorMode = 'fore';
  var swatches = $('#swatches');
  colors.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'swatch'; d.style.background = c; d.dataset.c = c;
    d.addEventListener('click', function () {
      fmt(colorMode === 'fore' ? 'foreColor' : 'hiliteColor', c);
      colorPop.classList.remove('show');
    });
    swatches.appendChild(d);
  });
  function toggleColorPop(mode, btn) {
    colorMode = mode;
    $('#colorLabel').textContent = mode === 'fore' ? '文字颜色' : '背景高亮';
    if (colorPop.classList.contains('show') && colorPop.dataset.mode === mode) { colorPop.classList.remove('show'); return; }
    colorPop.dataset.mode = mode;
    var r = btn.getBoundingClientRect();
    colorPop.style.left = Math.min(r.left, window.innerWidth - 190) + 'px';
    colorPop.style.top = (r.bottom + 6) + 'px';
    colorPop.classList.add('show');
  }
  $('#btnColor').addEventListener('click', function () { toggleColorPop('fore', this); });
  $('#btnHilite').addEventListener('click', function () { toggleColorPop('back', this); });
  document.addEventListener('mousedown', function (e) {
    if (!e.target.closest('#colorPop') && !e.target.closest('#btnColor') && !e.target.closest('#btnHilite'))
      colorPop.classList.remove('show');
  });

  /* ================= 媒体操作条（宽度/删除） ================= */
  function showMediaBar(fig) {
    var rect = fig.getBoundingClientRect();
    mediaBar.style.display = 'flex';
    mediaBar.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - mediaBar.offsetWidth - 8)) + 'px';
    mediaBar.style.top = (rect.bottom + 6) + 'px';
  }
  editor.addEventListener('click', function (e) {
    // 划线高亮：点开评论面板
    var hl = e.target.closest('span.hl');
    if (hl) {
      openPanel(false);
      locateCid(hl.dataset.cid);
      return;
    }
    var fig = e.target.closest('figure.media');
    document.querySelectorAll('#editor figure.media.selected').forEach(function (f) { f.classList.remove('selected'); });
    if (fig) {
      fig.classList.add('selected');
      mediaTarget = fig;
      showMediaBar(fig);
      if (fig.classList.contains('commented') && fig.dataset.cid) {
        openPanel(false);
        locateCid(fig.dataset.cid);
      }
    } else {
      mediaTarget = null;
      mediaBar.style.display = 'none';
    }
  });
  mediaBar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  mediaBar.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !mediaTarget) return;
    if (btn.dataset.w) {
      if (btn.dataset.w === 'auto') mediaTarget.style.width = '';
      else mediaTarget.style.width = btn.dataset.w + '%';
      showMediaBar(mediaTarget);
      scheduleSave();
    } else if (btn.id === 'mbDelete') {
      mediaTarget.remove();
      mediaTarget = null;
      mediaBar.style.display = 'none';
      scheduleSave();
    } else if (btn.id === 'mbCaption') {
      var cap = mediaTarget.querySelector('figcaption');
      if (!cap) { cap = document.createElement('figcaption'); mediaTarget.appendChild(cap); }
      var t = prompt('请输入说明文字：', cap.textContent || '');
      if (t !== null) { cap.textContent = t; scheduleSave(); }
    } else if (btn.id === 'mbComment') {

  wrap.addEventListener('scroll', function () { mediaBar.style.display = 'none'; mediaTarget = null; updateTocActive(); });

  /* ================= 粘贴 / 拖拽 ================= */
  /* 清理媒体：剥内联宽高；裸图/裸视频包进 figure 块（避免混在文字行里）；删空说明 */
  function sanitizeMedia() {
    editor.querySelectorAll('img, video').forEach(function (m) {
      m.removeAttribute('width');
      m.removeAttribute('height');
      if (m.style) { m.style.width = ''; m.style.height = ''; m.style.maxWidth = ''; }
      if (m.tagName === 'VIDEO' && !m.hasAttribute('controls')) m.setAttribute('controls', '');
      var fig = m.closest('figure.media');
      if (!fig) {
        fig = document.createElement('figure');
        fig.className = 'media';
        var parent = m.parentElement;
        if (parent && parent !== editor && !parent.textContent.trim()) {
          // 所在段落只有这张图：整段换成 figure
          parent.parentNode.replaceChild(fig, parent);
        } else if (parent && parent !== editor) {
          // 段落里图文混排：图抽出来放段落后，保持独立成块
          parent.parentNode.insertBefore(fig, parent.nextSibling);
        } else {
          editor.appendChild(fig);
        }
        fig.appendChild(m);
      }
    });
    editor.querySelectorAll('figcaption').forEach(function (c) {
      if (!c.textContent.trim()) c.remove();
    });
  }

  /* ---- 外部 HTML 粘贴净化：标题降级为加粗正文、剥掉源站样式 ---- */
  var PASTE_UNWRAP = { SPAN: 1, FONT: 1, MARK: 1, SMALL: 1, SECTION: 1, ARTICLE: 1, MAIN: 1, HEADER: 1, FOOTER: 1, FIGURE: 1, CENTER: 1, NOBR: 1, HTML: 1 };
  var PASTE_DROP = { SCRIPT: 1, STYLE: 1, META: 1, LINK: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, FORM: 1, INPUT: 1, BUTTON: 1, SELECT: 1, TEXTAREA: 1, NOSCRIPT: 1, SVG: 1, HEAD: 1, TITLE: 1 };
  var PASTE_ATTR_KEEP = { A: ['href'], IMG: ['src', 'alt'], VIDEO: ['src', 'controls'] };
  function sanitizePastedHtml(html) {
    // 飞书等来源给的是完整 HTML 文档，直接解析；片段则补 body 包裹再解析
    var doc = new DOMParser().parseFromString(html, 'text/html');
    if (!doc.body || !doc.body.innerHTML.trim()) {
      doc = new DOMParser().parseFromString('<html><body>' + html + '</body></html>', 'text/html');
    }
    var body = doc.body;
    // 1. h1-h6 全部降级为 <p><strong>…</strong></p>（避免满屏大标题、目录被刷爆）
    var hs = body.querySelectorAll('h1, h2, h3, h4, h5, h6');
    for (var i = 0; i < hs.length; i++) {
      var p = doc.createElement('p');
      var st = doc.createElement('strong');
      st.innerHTML = hs[i].innerHTML;
      p.appendChild(st);
      hs[i].parentNode.replaceChild(p, hs[i]);
    }
    // 2. 表格结构摊平为段落（编辑器不支持表格，保住文字）
    var tds = body.querySelectorAll('td, th');
    for (i = tds.length - 1; i >= 0; i--) {
      var tp = doc.createElement('p');
      tp.innerHTML = tds[i].innerHTML;
      tds[i].parentNode.replaceChild(tp, tds[i]);
    }
    ['table', 'tbody', 'thead', 'tfoot', 'tr', 'colgroup', 'col'].forEach(function (tag) {
      var els = body.querySelectorAll(tag);
      for (var j = els.length - 1; j >= 0; j--) {
        var fr = doc.createElement('div');
        fr.innerHTML = els[j].innerHTML;
        els[j].parentNode.replaceChild(fr, els[j]);
      }
    });
    // 3. 逐元素清理：删危险标签、拆包装标签、剥属性
    var all = body.querySelectorAll('*');
    for (i = all.length - 1; i >= 0; i--) {
      var el = all[i];
      if (!el.parentNode) continue;
      var tag = el.tagName;
      if (PASTE_DROP[tag]) { el.parentNode.removeChild(el); continue; }
      if (PASTE_UNWRAP[tag]) {
        while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
        el.parentNode.removeChild(el);
        continue;
      }
      // 剥属性：只保留白名单（去掉 style/class/宽高/颜色等）
      var keep = PASTE_ATTR_KEEP[tag] || [];
      for (var a = el.attributes.length - 1; a >= 0; a--) {
        var name = el.attributes[a].name;
        if (keep.indexOf(name) < 0) el.removeAttribute(name);
      }
      if (tag === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
    }
    // 4. 清空白元素（没有文字、没有媒体/br 的空壳）
    var changed = true;
    while (changed) {
      changed = false;
      var maybe = body.querySelectorAll('p, div, b, strong, i, em, u, s, li, blockquote');
      for (i = maybe.length - 1; i >= 0; i--) {
        var m = maybe[i];
        if (!m.textContent.replace(/[ ​]/g, '').trim() && !m.querySelector('img, video, br')) {
          m.parentNode.removeChild(m);
          changed = true;
        }
      }
    }
    // 5. 裸图/裸视频包成 figure 块，不与文字混排
    var meds = body.querySelectorAll('img, video');
    for (i = meds.length - 1; i >= 0; i--) {
      var md = meds[i];
      var up = md, inFig = false;
      while (up) { if (up.tagName === 'FIGURE') { inFig = true; break; } up = up.parentElement; }
      if (inFig) continue;
      var fig = doc.createElement('figure');
      fig.className = 'media';
      var par = md.parentElement;
      if (par && par !== body && !par.textContent.trim()) par.parentNode.replaceChild(fig, par);
      else if (par && par !== body) par.parentNode.insertBefore(fig, par.nextSibling);
      else body.appendChild(fig);
      fig.appendChild(md);
    }
    return body.innerHTML;
  }

  editor.addEventListener('paste', function (e) {
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) {
      e.preventDefault();
      [].forEach.call(files, insertFile);
      return;
    }
    var html = e.clipboardData && e.clipboardData.getData('text/html');
    if (html && html.trim()) {
      e.preventDefault();
      var clean = '';
      try {
        clean = sanitizePastedHtml(html);
      } catch (err) {
        console.error('[云笺] 粘贴净化失败，回退纯文本：', err);
      }
      if (clean && clean.trim()) {
        insertHtmlAtCaret(clean);
      } else {
        // 兜底：净化失败/结果为空时插入纯文本，保证粘贴永远有反应
        var text = e.clipboardData.getData('text/plain') || '';
        if (text) {
          insertHtmlAtCaret('');
          document.execCommand('insertText', false, text);
        }
      }
      scheduleSave();
      return;
    }
    setTimeout(sanitizeMedia, 0);
  });

  /* 在光标处插入 HTML；选区不在编辑器内时先定位到文末 */
  function insertHtmlAtCaret(html) {
    var s = document.getSelection();
    var inEditor = s.rangeCount && editor.contains(s.anchorNode);
    if (!inEditor) {
      editor.focus();
      var r = document.createRange();
      r.selectNodeContents(editor); r.collapse(false);
      s.removeAllRanges(); s.addRange(r);
    }
    if (html) document.execCommand('insertHTML', false, html);
  }
  wrap.addEventListener('dragenter', function (e) { e.preventDefault(); dragCount++; wrap.classList.add('dragging'); });
  wrap.addEventListener('dragover', function (e) { e.preventDefault(); });
  wrap.addEventListener('dragleave', function (e) { dragCount = Math.max(0, dragCount - 1); if (!dragCount) wrap.classList.remove('dragging'); });
  wrap.addEventListener('drop', function (e) {
    e.preventDefault(); dragCount = 0; wrap.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files) [].forEach.call(e.dataTransfer.files, insertFile);
  });

  /* ================= 划线评论（面板常驻右侧） ================= */
  function openPanel(showNew) {

  $('#cpClose').addEventListener('click', collapsePanel);

  // 防“孤儿”划线：点到评论面板以外、且草稿没写内容 → 自动撤销草稿划线
  document.addEventListener('mousedown', function (e) {
    if (!draftCid) return;
    if ($('#cpText').value.trim()) return;
    if (e.target.closest('#commentPanel')) return;
    unwrapHl(draftCid);

  function wrapSelection(cid) {
    var s = window.getSelection();
    if (!s.rangeCount || s.isCollapsed) return null;
    var r = s.getRangeAt(0);
    if (!editor.contains(r.commonAncestorContainer)) return null;
    // 只允许同一块内划线，避免跨段落产生坏结构
    var startNode = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
    var endNode = r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement;
    if (getClosestBlock(startNode) !== getClosestBlock(endNode)) return null;
    var span = document.createElement('span');
    span.className = 'hl';
    span.dataset.cid = cid;
    try {
      r.surroundContents(span);
    } catch (e) {
      try { span.appendChild(r.extractContents()); r.insertNode(span); } catch (e2) { return null; }
    }
    return span;
  }
  function unwrapHl(cid) {
    var span = editor.querySelector('span.hl[data-cid="' + cid + '"]');
    if (span) {
      var parent = span.parentNode;
      while (span.firstChild) parent.insertBefore(span.firstChild, span);
      parent.removeChild(span);
      scheduleSave();
    }
    var fig = editor.querySelector('figure.media[data-cid="' + cid + '"]');
    if (fig) {
      delete fig.dataset.cid;
      fig.classList.remove('commented');
      scheduleSave();
    }
  }
  function locateCid(cid) {
    if (!cid) return;
    var span = editor.querySelector('span.hl[data-cid="' + cid + '"]');
    var fig = editor.querySelector('figure.media[data-cid="' + cid + '"]');
    var el = span || fig;
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (span) { span.classList.remove('flash'); void span.offsetWidth; span.classList.add('flash'); }
    }
    var item = $('#cpList .cp-item[data-cid="' + cid + '"]');
    if (item) item.scrollIntoView({ block: 'nearest' });
  }

  /* 文字划线：选中即触发（也可点工具栏按钮） */
  function commentFlowText(quote) {
    var cid = uid();
    if (!wrapSelection(cid)) { toast('无法标记该选区，请选择同一段落内的文字'); return null; }
    scheduleSave();
    draftCid = cid; draftQuote = quote.slice(0, 500);
    openPanel(true);
    $('#cpQuote').textContent = quote;
    $('#cpText').value = '';
    $('#cpText').focus();
    return cid;
  }
  /* 图片/视频评论 */
  function commentMedia(fig) {
    if (!fig) return;
    var cid = fig.dataset.cid;
    if (!cid) {
      cid = uid();
      fig.dataset.cid = cid;
      fig.classList.add('commented');
      scheduleSave();
    }
    draftCid = cid;
    var media = fig.querySelector('img, video');
    var cap = fig.querySelector('figcaption');
    draftQuote = (media && media.tagName === 'VIDEO' ? '🎬 视频' : '🖼 图片') +
      (cap && cap.textContent ? '：' + cap.textContent.slice(0, 60) : '');
    openPanel(true);
    $('#cpQuote').textContent = draftQuote;
    $('#cpText').value = '';
    $('#cpText').focus();
  }
  function commentFlow() {
    var s = window.getSelection();
    var hasSel = s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode);
    if (hasSel) {
      var quote = s.toString().trim();
      if (!quote) { openPanel(false); return; }
      commentFlowText(quote);
    } else {
      openPanel(false);
    }
  }
  function sendDraft() {
    var text = $('#cpText').value.trim();
    if (!text) { toast('评论内容不能为空'); return; }
    if (!draftCid) return;
    api('POST', '/api/docs/' + store.activeId + '/comments',
      { cid: draftCid, quote: draftQuote, body: text.slice(0, 2000), author: user.name, color: user.color })
      .then(function () {
        draftCid = null;
        $('#cpNew').style.display = 'none';
        $('#cpText').value = '';
        loadComments();
        toast('评论已添加 ✓');
      })
      .catch(function () { toast('评论发送失败'); });
  }
  $('#cpSend').addEventListener('click', sendDraft);
  $('#cpText').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDraft(); } // 回车发送，Shift+回车换行
    if (e.key === 'Escape') { e.preventDefault(); $('#cpCancel').click(); }
  });
  $('#cpCancel').addEventListener('click', function () {
    if (draftCid) unwrapHl(draftCid); // 取消则去掉刚画的高亮
    draftCid = null;

  });

  function loadComments() {
    if (!store.activeId) return Promise.resolve();
    return api('GET', '/api/docs/' + store.activeId + '/comments').then(function (cs) {
      comments = cs || [];
      renderComments();
    });
  }
  var cpTab = 'open';
  document.querySelectorAll('#cpTabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#cpTabs button').forEach(function (b) { b.classList.remove('cur'); });
      btn.classList.add('cur');
      cpTab = btn.dataset.ctab;
      renderComments();
    });
  });
  function renderComments() {
    var open = comments.filter(function (c) { return !c.resolved; });
    var done = comments.filter(function (c) { return c.resolved; });
    $('#cpOpenCount').textContent = open.length;
    $('#cpDoneCount').textContent = done.length;
    var list = $('#cpList');
    list.innerHTML = '';
    if (cpTab === 'open') {
      if (!open.length) {
        list.innerHTML = '<div class="cp-empty">暂无待解决评论<br>选中文字即可划线留言</div>';
        return;
      }
      open.forEach(function (c) { list.appendChild(buildOpenItem(c)); });
    } else {
      if (!done.length) {
        list.innerHTML = '<div class="cp-empty">还没有已解决的评论</div>';
        return;
      }
      done.slice().reverse().forEach(function (c) { list.appendChild(buildDoneItem(c)); });
    }
  }
  function buildOpenItem(c) {
    var it = document.createElement('div');
    it.className = 'cp-item';
    it.dataset.cid = c.cid;
    it.innerHTML =
      '<div class="cp-head2"><span class="cp-dot" style="background:' + esc(c.color || '#86868b') + '"></span>' +
      '<span class="cp-author"></span><span class="cp-time">' + fmtTime(c.created) + '</span></div>' +
      '<div class="cp-quote"></div><div class="cp-body"></div>' +
      '<div class="cp-acts"><button data-act="locate">📍 定位</button><button data-act="resolve">✓ 解决</button></div>';
    $('.cp-author', it).textContent = c.author;
    $('.cp-quote', it).textContent = c.quote;
    $('.cp-body', it).textContent = c.body;
    it.addEventListener('click', function (e) {

  function buildDoneItem(c) {

      '<div class="cp-head2"><span class="cp-dot" style="background:' + esc(c.color || '#86868b') + '"></span>' +

  function resolveComment(c) {

  function hideSlash() { slashIsOpen = false; slashMenu.classList.remove('show'); }
  function currentQuery() {
    var s = document.getSelection();
    if (!s.rangeCount || !slashStart) return null;
    if (!slashStart.startContainer.isConnected) return null;
    var c = s.getRangeAt(0);
    if (c.startContainer !== slashStart.startContainer) return null;
    try {
      var r = document.createRange();
      r.setStart(slashStart.startContainer, slashStart.startOffset);
      r.setEnd(c.startContainer, c.startOffset);
      var q = r.toString();
      if (q.charAt(0) !== '/' || /\s/.test(q) || q.length > 14) return null;
      return q.slice(1).toLowerCase();
    } catch (e) { return null; }
  }
  function caretRect() {
    var s = document.getSelection();
    if (!s.rangeCount) return null;
    var r = s.getRangeAt(0).cloneRange();
    r.collapse(false);
    var rect = null, rects = r.getClientRects();
    if (rects.length) rect = rects[0];
    if (!rect) {
      var span = document.createElement('span');
      span.textContent = '\u200b';
      r.insertNode(span);
      rect = span.getBoundingClientRect();
      span.remove();
    }
    return rect;
  }
  function renderSlash() {
    var q = currentQuery();
    if (q === null) { hideSlash(); return; }
    slashFiltered = slashItems.filter(function (it) {
      return !q || it.label.toLowerCase().indexOf(q) >= 0 || it.kw.indexOf(q) >= 0;
    });
    if (!slashFiltered.length) { hideSlash(); return; }
    slashCur = Math.min(slashCur, slashFiltered.length - 1);
    slashMenu.innerHTML = '';
    slashFiltered.forEach(function (it, i) {
      var div = document.createElement('div');
      div.className = 'slash-item' + (i === slashCur ? ' cur' : '');
      div.innerHTML = '<span class="slash-icon">' + it.icon + '</span><span>' + esc(it.label) + '</span>';
      div.addEventListener('mousedown', function (e) { e.preventDefault(); applySlashItem(it); });
      slashMenu.appendChild(div);
    });
    var rect = caretRect();
    if (!rect) { hideSlash(); return; }
    var wr = wrap.getBoundingClientRect();
    slashMenu.classList.add('show');
    var x = rect.left - wr.left + wrap.scrollLeft;
    var y = rect.bottom - wr.top + wrap.scrollTop + 6;
    slashMenu.style.left = Math.max(8, Math.min(x, wrap.clientWidth - 280)) + 'px';
    slashMenu.style.top = y + 'px';

  function applySlashItem(item) {
    var s = document.getSelection();
    try {
      var r = document.createRange();
      r.setStart(slashStart.startContainer, slashStart.startOffset);
      if (s.rangeCount) r.setEnd(s.getRangeAt(0).startContainer, s.getRangeAt(0).startOffset);
      var q = r.toString();
      if (q.charAt(0) === '/' && !/\s/.test(q)) r.deleteContents();
    } catch (e) {}
    hideSlash();
    item.run();
  }
  editor.addEventListener('keydown', function (e) {

        slashIsOpen = true; slashCur = 0;
        setTimeout(renderSlash, 0);
      }
      return;
    }
    if (slashIsOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); slashCur = (slashCur + 1) % slashFiltered.length; renderSlash(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); slashCur = (slashCur - 1 + slashFiltered.length) % slashFiltered.length; renderSlash(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        if (slashFiltered.length) applySlashItem(slashFiltered[slashCur]);
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideSlash(); return; }

        'figure.media{margin:20px auto;position:relative;max-width:100%}figure.media img,figure.media video{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;box-shadow:0 1px 6px rgba(31,35,41,.08)}figure.media video{background:#000}\n' +
        'figcaption{text-align:center;font-size:12.5px;color:#86868b;padding-top:6px}\n' +
        '.hl{background:#fff1a8;border-bottom:2px solid #f0b400;}\n' +
        'figure.media.commented img,figure.media.commented video{outline:2px solid #f0b400;outline-offset:3px;}\n' +
        'figure.media.commented::after{content:"\\1F4AC";position:absolute;top:-10px;right:10px;background:#f0b400;color:#fff;' +
        'font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;}\n' +
        '@media(max-width:700px){.page{padding:24px 18px}}\n</style>\n</head>\n<body>\n' +
        '<div class="page"><h1 style="font-size:30px;border-bottom:1px solid #f0f1f3;padding-bottom:16px">' + title + '</h1>' + inner + '</div>\n</body>\n</html>';
      var blob = new Blob([tpl], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (d.title || '文档') + '.html';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('已导出 📄 图片已内嵌，离线也能看；视频为在线链接');
    });
  });

  /* ================= Toast ================= */
  var toastTimer = null;
  function toast(msg, dur) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, dur || 2600);
  }

  /* ================= 启动 ================= */
  var WELCOME =
    '<h1>欢迎使用云笺 ✍️</h1>' +
    '<p>这是部署在服务器上的<b>类飞书</b>在线编辑器：文档内容存于 <b>SQLite 数据库</b>，图片 / 动图 / 视频上传后保存在服务器磁盘。</p>' +
    '<p>📑 文档<b>标题在正文正上方</b>，可直接修改；<b>左侧目录</b>会根据正文中的 H1–H3 标题自动生成，点击即可跳转。</p>' +
    '<p>👥 <b>多人协作</b>：顶栏头像显示谁在线，内容自动同步（约 2 秒）。</p>' +
    '<p>💬 <b>划线评论</b>：<b>选中文字即自动弹出评论框</b>（右侧面板常驻），点击已划线文字或带 💬 角标的图片/视频可回看评论，支持定位与解决。</p>' +
    '<p>🔗 <b>对外分享</b>：点顶栏「分享」生成链接，可设为「可查看」或「可编辑」。</p>' +
    '<blockquote>小技巧：空行输入 <b>/</b> 唤起快捷插入菜单；点击已插入的图片 / 视频可调整宽度。</blockquote>';

  var singleMode = false;

  function hideBoot() {
    bootMask.classList.add('hide');
    setTimeout(function () { if (bootMask.parentNode) bootMask.remove(); }, 400);
  }

  function fillDocView(d) {
    d.shareMode = d.share_mode || 'off';
    d.ownerId = d.owner_id || '';
    dirty = false;
    editor.innerHTML = d.html;
    titleInput.textContent = d.title;
    sanitizeMedia();
    renderList(); updateWordCount(); setStatus('saved');
    updateTopTitle(); buildToc();
    presenceTick();
    recordView();
    applyDocPerm();
  }

  function showGuestHome() {
    store.docs = [];
    store.activeId = null;
    titleInput.textContent = '欢迎来到云笺';
    editor.innerHTML =
      '<p>👋 这是一个支持多人协作、划线评论的在线文档。</p>' +
      '<p>💬 打开别人分享的链接，<b>无需登录</b>就能阅读和划线评论。</p>' +
      '<p>🔑 想写自己的文档？登录 / 注册即可创建，默认仅自己可见，生成分享链接后他人才可访问。</p>';
    renderList(); updateWordCount(); setStatus('saved'); updateTopTitle();
    applyDocPerm();
  }

  function boot() {
    var urlDoc = null;
    try { urlDoc = new URLSearchParams(location.search).get('doc'); } catch (e) {}
    if (urlDoc) {
      // 分享 / 单文档模式：只打开这一篇文档
      singleMode = true;
      document.body.classList.add('single');
      loadMe();
      api('GET', '/api/docs/' + urlDoc).then(function (d) {
        store.docs = [d];
        store.activeId = d.id;
        fillDocView(d);
        loadComments();
        hideBoot();
      }).catch(function (e) {
        bootMask.textContent = (e && e.status === 403)
          ? '🔒 此文档未开启分享，仅作者可见'
          : '⚠️ 文档不存在或已被删除';
        bootMask.style.color = '#d83931';
      });
      return;
    }
    loadMe().then(function () {
      if (!me) { showGuestHome(); hideBoot(); return; }
      api('GET', '/api/docs').then(function (docs) {
        store.docs = docs || [];
        if (!store.docs.length) {
          return api('POST', '/api/docs', { title: '欢迎使用云笺', html: WELCOME }).then(function (d) {
            store.docs.push(d);
          });
        }
      }).then(function () {
        var chain = Promise.resolve();
        store.docs.forEach(function (d) {
          chain = chain.then(function () {
            return api('GET', '/api/docs/' + d.id).then(function (full) {
              d.html = full.html;
              d.rev = full.rev;
              d.shareMode = full.share_mode || 'off';
              d.ownerId = full.owner_id || '';
              d.canEdit = full.can_edit !== false;
              d.isOwner = full.is_owner !== false;
            });
          });
        });
        return chain;
      }).then(function () {
        store.docs.sort(function (a, b) { return b.updated - a.updated; });
        store.activeId = store.docs[0].id;
        fillDocView(activeDoc());
        loadComments();
        hideBoot();
      }).catch(function (err) {
        bootMask.textContent = '⚠️ 无法连接服务器：' + err.message;
        bootMask.style.color = '#d83931';
      });
    });
  }

  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
  boot();
})();
</script>
</body>
</html>
